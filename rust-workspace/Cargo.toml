[workspace]
members = [
    "crates/audio-processor",
    "crates/timeline-engine",
    "crates/video-processor",
]
resolver = "2"

[workspace.package]
version = "0.0.0"
edition = "2021"
authors = ["Helix Team"]
license = "MIT"
repository = "https://github.com/helix/helix"

[workspace.dependencies]
# WASM bindings
wasm-bindgen = "0.2.93"
wasm-bindgen-futures = "0.4.43"
js-sys = "0.3.70"
web-sys = { version = "0.3.70", features = ["console"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"

# Audio processing
mp3lame-encoder = "0.2"
rubato = "0.15"
symphonia = { version = "0.5", features = ["mp3", "aac", "wav"] }

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Parallelization (WASM-compatible)
rayon = "1.10"

# Utilities
bytemuck = "1.14"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.dev]
opt-level = 0
debug = true
